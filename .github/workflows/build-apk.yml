name: Build APK

# Chained to run right after "Unzip Project" finishes, so a normal update is just: upload a zip
# (or paste files via GitHub's web UI) and both workflows go green on their own. Also runs on any
# direct push to main (e.g. pasting a single changed file) and can be triggered manually.
on:
  workflow_run:
    workflows: ["Unzip Project"]
    types: [completed]
  push:
    branches: [main, master]
    paths-ignore:
      - "*.zip"
      - "**.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Determine checkout ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Bump version (+0.1) and log a changelog entry
        id: bump
        run: |
          set -e
          GRADLE_FILE="app/build.gradle.kts"
          CURRENT=$(grep -oP '(?<=val appVersionName = ")[^"]+' "$GRADLE_FILE")
          NEW=$(python3 - "$CURRENT" << 'EOF'
          import sys
          current = sys.argv[1]
          major, minor = (int(p) for p in current.split("."))
          minor += 1
          if minor >= 10:
              major += 1
              minor = 0
          print(f"{major}.{minor}")
          EOF
          )
          echo "Bumping version $CURRENT -> $NEW"
          sed -i "s/val appVersionName = \"$CURRENT\"/val appVersionName = \"$NEW\"/" "$GRADLE_FILE"

          NOTE=$(git log -1 --pretty=%s | sed "s/\[skip ci\]//I" | sed 's/"/\\"/g' | xargs)
          if [ -z "$NOTE" ]; then NOTE="Automated build."; fi
          TODAY=$(date -u +%Y-%m-%d)

          python3 - "$NEW" "$TODAY" "$NOTE" << 'EOF'
          import sys
          version, date, note = sys.argv[1], sys.argv[2], sys.argv[3]
          path = "app/src/main/java/app/orionmd/management/Changelog.kt"
          with open(path) as f:
              content = f.read()
          marker = "// CHANGELOG_INSERT_MARKER"
          new_line = f'        ChangelogItem("{version}", "{date}", "{note}"),\n        {marker}'
          content = content.replace(marker, new_line, 1)
          with open(path, "w") as f:
              f.write(content)
          EOF

          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts app/src/main/java/app/orionmd/management/Changelog.kt
          git commit -m "Bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
          git push origin HEAD:${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: management-v${{ steps.bump.outputs.new_version }}-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.new_version }}
          name: Management v${{ steps.bump.outputs.new_version }}
          make_latest: true
          files: app/build/outputs/apk/debug/*.apk
          body: |
            Automated build - v${{ steps.bump.outputs.new_version }}
